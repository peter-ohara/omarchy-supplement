# Hyprland configuration overrides

# monitors.conf

# Use single default monitor (see all monitors with: hyprctl monitors)
env = GDK_SCALE,1
monitor=DP-1,5120x1440@60,auto,1,bitdepth,10

# input.conf
input {
  kb_options = compose:ralt

  # Change speed of keyboard repeat
  # repeat_rate = 50
  # repeat_delay = 300
}

# looknfeel.conf
general {
    layout = scrolling
}

scrolling {
    fullscreen_on_one_column = false
    column_width = 0.25
    focus_fit_method = 1 # 0 - center, 1 - fit
    follow_focus = true
    # follow_min_visible = 0.4
    explicit_column_widths = 0.25, 0.5
    direction = right
}

# Navigation
# Move focus with SUPER + hl keys

unbind = SUPER, H
unbind = SUPER, L
bindd = SUPER, H, Move focus left, layoutmsg, focus left
bindd = SUPER, L, Move focus right, layoutmsg, focus right

# Swap active window with the one next to it with SUPER + SHIFT + hl keys
unbind = SUPER SHIFT, H
unbind = SUPER SHIFT, L
bindd = SUPER SHIFT, H, Swap window to the left, layoutmsg, swapcol l
bindd = SUPER SHIFT, L, Swap window to the right, layoutmsg, swapcol r

# Resize the current column with SUPER + minus/plus
unbind = SUPER, minus
unbind = SUPER, equal
bind = SUPER, minus, layoutmsg, colresize -conf
bind = SUPER, equal, layoutmsg, colresize +conf

# Toggle the focus fit method
# bind = SUPER, R, layoutmsg, togglefit

# misc {
#   mouse_move_enables_dpms=true
#   key_press_enables_dpms=true
# }

workspace = 5, monitor:DP-1, default:true

windowrule=workspace 1, match:class Spotify
windowrule=workspace 1, match:class chrome-my.brain.fm.*
windowrule=workspace 1, match:class chrome-music.youtube.com.*
windowrule=workspace 1, match:class org.omarchy.cliamp

windowrule=workspace 2, match:class chrome-web.whatsapp.com.*

windowrule=workspace 6, match:class chrome-my.hospitable.com.*

windowrule=workspace 8, match:class anki

windowrule=workspace 9, match:class chrome-web.akiflow.com.*
windowrule=workspace 9, match:class obsidian
windowrule=workspace 9, match:class superproductivity-bin

bindd = SUPER SHIFT, T, Superproductivity, exec, omarchy-launch-or-focus ^superproductivity-bin$ "uwsm-app -- superproductivity"
