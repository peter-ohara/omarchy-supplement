# Hyprland configuration overrides
# Add your custom settings here

#  Allow hyprpm to load plugins.
#  Prevents a popup asking for permission every time hyprpm tries to load
#  a plugin.
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

# Use single default monitor (see all monitors with: hyprctl monitors)
# Straight 1x setup for low-resolution displays like 1080p or 1440p
env = GDK_SCALE,1
monitor=DP-1,5120x1440@60,auto,1,bitdepth,10

input {
  # Use multiple keyboard layouts and switch between them with Alt + Space
  # kb_layout = us,dk
  # kb_options = compose:caps,grp:alt_space_toggle
  kb_options = compose:ralt

  # Change speed of keyboard repeat
  # repeat_rate = 50
  # repeat_delay = 220

  repeat_rate = 50
  repeat_delay = 300

  touchpad {
    scroll_factor = 0.4
  }
}

general {
    layout = scrolling
}

scrolling {
    fullscreen_on_one_column = false
    column_width = 0.5
    focus_fit_method = 1 # 0 - center, 1 - fit
    follow_focus = true
    # follow_min_visible = 0.4
    explicit_column_widths = 0.25, 0.5
    direction = right
}

# Move focus with SUPER + hl keys
unbind = SUPER, H
unbind = SUPER, L
bindd = SUPER, H, Move focus left, layoutmsg, focus left
bindd = SUPER, L, Move focus right, layoutmsg, focus right

# Swap active window with the one next to it with SUPER + SHIFT + hl keys
unbind = SUPER SHIFT, H
unbind = SUPER SHIFT, L
bindd = SUPER SHIFT, H, Swap window to the left, layoutmsg, swapcol l
bindd = SUPER SHIFT, L, Swap window to the right, layoutmsg, swapcol r

# Resize the current column with SUPER + minus/plus
unbind = SUPER, minus
unbind = SUPER, equal
bind = SUPER, minus, layoutmsg, colresize -conf
bind = SUPER, equal, layoutmsg, colresize +conf

# Toggle the focus fit method
bind = SUPER, R, layoutmsg, togglefit

misc {
  mouse_move_enables_dpms=true
  key_press_enables_dpms=true
}

workspace = 5, monitor:DP-1, default:true

windowrule=workspace 1, match:class Spotify
windowrule=workspace 1, match:class chrome-my.brain.fm.*
windowrule=workspace 1, match:class chrome-music.youtube.com.*

windowrule=workspace 2, match:class chrome-web.whatsapp.com.*

windowrule=workspace 6, match:class chrome-my.hospitable.com.*

windowrule=workspace 8, match:class anki

windowrule=workspace 9, match:class chrome-web.akiflow.com.*

# Example overrides:
# $mainMod = SUPER
$terminal = uwsm app -- ghostty
$browser = chromium --force-device-scale-factor=0.8

unbind = SUPER, D
bindd = SUPER, D, Discord, exec, omarchy-launch-webapp "https://discord.com/channels/@me"
unbind = SUPER, G
bindd = SUPER, G, Notion, exec, omarchy-launch-webapp "https://www.notion.so/"

unbind = SUPER, B
bindd = SUPER, B, Bluetooth, exec, omarchy-launch-tui bluetui
bindd = SUPER ALT, B, Zen Browser, exec, zen-browser

unbind = SUPER, S
bindd = SUPER, S, Sound, exec, omarchy-launch-tui wiremix

# My Favorite App
unbind = SUPER SHIFT, M
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus-webapp chrome-music.youtube.com.* "https://music.youtube.com/"

unbind = SUPER SHIFT, G
bindd = SUPER SHIFT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"

unbind = SUPER SHIFT, N
bindd = SUPER SHIFT, N, Hospitable, exec, omarchy-launch-or-focus-webapp chrome-my.hospitable.com.* "https://my.hospitable.com/calendar/occupancy"

unbind = SUPER SHIFT, T
bindd = SUPER SHIFT, T, Terminal, exec, omarchy-launch-or-focus com.mitchellh.ghostty $terminal

bindd = SUPER SHIFT, D, Anki, exec, omarchy-launch-or-focus anki "uwsm app -- anki"

unbind = SUPER SHIFT, P
bindd = SUPER SHIFT, P, Akiflow, exec, omarchy-launch-or-focus-webapp "Akiflow" "https://web.akiflow.com"

bindd = SUPER, semicolon, BTop, exec, $terminal -e btop
bindd = SUPER SHIFT, semicolon, Restart Waybar, exec, omarchy-restart-waybar



# Extra autostart processes
exec-once = hyprpm reload -n
