# Window Navigation (Alt+Shift+H/L)
bind -n M-H previous-window
bind -n M-L next-window

# Quick Clear
# bind K send-keys "clear"\; send-keys "Enter"

# Window Splitting (Vim style: s = horizontal, v = vertical)
unbind '"'
