# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"

# Left Status
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{E:@catppuccin_status_session}"

# Right Status
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{E:@catppuccin_status_directory}"
set -ga status-right "#{E:@catppuccin_status_application}"

# Panes setting
set -g @catppuccin_pane_status_enabled "yes"
set -g @catppuccin_pane_border_status "yes"

# Windows
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_number "#I "
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_current_number "#I "

set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_flags_icon_last ""
set -g @catppuccin_window_flags_icon_current ""
set -g @catppuccin_window_flags_icon_zoom "()"
set -g @catppuccin_window_flags_icon_mark " "
set -g @catppuccin_window_flags_icon_silent " "
set -g @catppuccin_window_flags_icon_activity " "
set -g @catppuccin_window_flags_icon_bell " "

# Status Style
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_module_bg_color "#{@thm_surface_0}"
