# Neovim compatibility
set -sg escape-time 10      # Snappy escape key in Neovim

# Renaming
set -g allow-rename off
set -g allow-set-title on

# Yazi Image Previews
# -----------------------------------------------------------------------------
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

source-file ~/omarchy-supplement/install-scripts/tmux.keybinds.conf
source-file ~/omarchy-supplement/install-scripts/tmux.catppuccin.conf

# Plugins
# -----------------------------------------------------------------------------
# set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
